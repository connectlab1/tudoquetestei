# Configurações Principais
title: Tudo Que Testei
description: Experimentos práticos, análises de ferramentas, livros e testes do dia a dia.
author: ConnectLab
email: contato@connectlab.ddns.net

# Caminhos base obrigatórios para subpasta no GitHub Pages
url: "https://connectlab1.github.io"
baseurl: "/tudoquetestei"

# Localização e Idioma
lang: pt-BR
timezone: America/Sao_Paulo

# Tema e Estilo
theme: minima

# Plugins do GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclusões do Build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/
