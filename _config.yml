# ==========================================
# Configurações Globais do Blog
# ==========================================
title: "Tudo Que Testei"
email: "contato@connectlab.ddns.net"
description: "Laboratório técnico sobre desenvolvimento web, infraestrutura, automação e testes práticos."
url: "https://connectlab1.github.io"
baseurl: "/tudoquetestei"

author:
  name: "Jean de Arruda"
  github: "connectlab1"

# ==========================================
# Compilação Sass / SCSS
# ==========================================
sass:
  sass_dir: assets/css
  style: compressed

# ==========================================
# Paginação (jekyll-paginate)
# ==========================================
paginate: 4
paginate_path: "/page:num/"

# ==========================================
# Formatação de Datas e Permalinks
# ==========================================
permalink: /:categories/:year/:month/:day/:title/
timezone: "America/Sao_Paulo"

# ==========================================
# Plugins e Exclusões de Build
# ==========================================
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/
