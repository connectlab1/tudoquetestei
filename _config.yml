# =================================================
# Tudo Que Testei - Configurações Globais
# =================================================

# Informações Principais do Site
title: Tudo Que Testei
email: ""
description: >-
  Laboratório prático de documentação técnica, testes de sistemas, 
  scripts, ferramentas de código aberto e desenvolvimento estático.
baseurl: "/tudoquetestei" # Nome exato do repositório no GitHub
url: "https://connectlab1.github.io" # Substitua pelo seu nome de usuário do GitHub se necessário

# Informações do Autor
author:
  name: Jean de Arruda
  github: connectlab1

# Configurações de Idioma e Fuso Horário
lang: pt-BR
timezone: America/Sao_Paulo

# Tema e Plugins
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Configuração de Datas (Formato Brasileiro DD/MM/YYYY)
minima:
  date_format: "%d/%m/%Y"

# Configurações do Compilador de Sass/SCSS
sass:
  sass_dir: assets/css
  style: compressed

# Ignorar arquivos/pastas durante o build estático
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
